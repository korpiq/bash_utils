# Caps Lock: tap = Escape, hold = Control, Shift+Caps = Caps Lock.
# Right Control: tap = Escape, hold = Control.
# Pause: Tab, for tabbing while typing on the numpad.

[ids]
*

[main]
capslock = overloadt(control, esc, 200)
rightcontrol = overloadt(control, esc, 200)
pause = tab

[shift]
capslock = capslock
